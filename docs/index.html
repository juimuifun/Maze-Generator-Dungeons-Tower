<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Minecraft Maze Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar ด้านซ้าย -->
        <div class="sidebar">
            <h2>Maze Simulator</h2>
            
            <details class="sidebar-section" open>
                <summary>⚙️ Scale & Settings</summary>
                <div class="settings-panel">
                    <label>Size (Width x Length):<br>
                        <input type="number" id="width" value="15" style="width: 60px;"> x 
                        <input type="number" id="length" value="15" style="width: 60px;">
                    </label>
                    <label>Path Width (blocks): <input type="number" id="pathWidth" value="3" style="width: 60px;"></label>
                    <label>Floor Height (blocks): <input type="number" id="floorHeight" value="5" style="width: 60px;"></label>
                    <label>Number of Floors: <input type="number" id="floors" value="3" style="width: 60px;"></label>
                    <label>Maze Complexity (1-10): <span id="mazeCompVal">5</span>
                        <input type="range" id="mazeComplexity" value="5" min="1" max="10" style="width: 100%;" oninput="document.getElementById('mazeCompVal').innerText=this.value">
                    </label>
                    <label>Encounter Difficulty (1-10): <span id="encDiffVal">5</span>
                        <input type="range" id="encounterDifficulty" value="5" min="1" max="10" style="width: 100%;" oninput="document.getElementById('encDiffVal').innerText=this.value">
                    </label>
                    <label>Start From: 
                        <select id="startDirection" style="width: 100%;">
                            <option value="bottom">Bottom (Boss at Top)</option>
                            <option value="top">Top (Boss at Bottom)</option>
                        </select>
                    </label>
                    <label>Seed (blank for random): <input type="text" id="seed" placeholder="12345ABC" style="width: 100%;"></label>
                    <button onclick="generateMaze()" class="btn-primary">Generate Maze</button>
                </div>
            </details>

            <details class="sidebar-section">
                <summary>🌍 Global Settings</summary>
                <div class="settings-panel">
                    <label>Cooldown (Hours): <input type="number" id="ruleCooldown" value="24" style="width: 100%;"></label>
                    <label>Min Players: <input type="number" id="ruleMinP" value="1" style="width: 100%;"></label>
                    <label>Max Players: <input type="number" id="ruleMaxP" value="4" style="width: 100%;"></label>
                    <label>Time Limit (Min): <input type="number" id="ruleTime" value="60" style="width: 100%;"></label>
                    <hr style="border: 1px solid #444; margin: 10px 0;">
                    <label><b>Custom Items</b></label>
                    <div id="customItemsContainer"></div>
                    <button onclick="window.addCustomItemUI()" class="btn-primary" style="font-size:12px; margin-top:5px;">+ Add Custom Item</button>
                </div>
            </details>

            <details class="sidebar-section" id="editToolsSection" open>
                <summary>🖌️ Tools & Legend</summary>
                <div style="margin-bottom: 10px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: bold; background: #333; padding: 8px; border-radius: 4px;">
                        <input type="checkbox" id="editModeToggle" onchange="toggleEditMode()" style="width: 18px; height: 18px;">
                        Enable Edit Mode
                    </label>
                </div>
                <div id="brushContainer" style="opacity: 0.5; pointer-events: none;">
                    <label style="font-size: 13px; color:#bbb;">Click & Drag on grid to paint</label>
                    <select id="brushSelect" style="width: 100%; padding: 8px; margin-bottom: 10px; cursor: pointer; font-size: 16px;">
                        <option value="0">⬛ Wall</option>
                        <option value="1">⬜ Path</option>
                        <option value="START">🏁 Start</option>
                        <option value="STAIRS_UP">🔼 Stairs Up</option>
                        <option value="STAIRS_DOWN">🔽 Stairs Down</option>
                        <option value="MONSTER">🧟 Monster</option>
                        <option value="MINI_BOSS">👹 Mini Boss</option>
                        <option value="BOSS">💀 Boss</option>
                        <option value="TRAP">⚠️ Trap</option>
                        <option value="SECRET">🎁 Secret Room</option>
                    </select>
                </div>
                <div style="font-size: 13px; line-height: 1.8;">
                    <div style="color: #FFEB3B;">🟨 Guide Path (Toggleable)</div>
                </div>
                <button id="toggleGuideBtn" onclick="toggleGuide()" disabled style="width: 100%; margin-top: 10px;">Toggle Guide Path</button>
            </details>

            <details class="sidebar-section" open>
                <summary>💾 Data Management</summary>
                <button id="exportJsonBtn" onclick="exportJSON()" disabled class="btn-export">Export JSON for Plugin</button>
                <input type="file" id="importJsonInput" accept=".json" style="display: none;" onchange="importJSON(event)">
                <button id="importJsonBtn" onclick="document.getElementById('importJsonInput').click()" class="btn-import">Import JSON</button>
            </details>
            
            <div id="mcSizeInfo" style="margin-top: 15px; color: #4CAF50; font-size: 12px; font-weight: bold;"></div>
        </div>

        <!-- พื้นที่ทำงานตรงกลาง -->
        <div class="main-content">
            <div class="top-bar">
                <div id="floorNavigation" style="display: none; align-items: center; gap: 15px;">
                    <button onclick="prevFloor()">◀ Prev Floor</button>
                    <span id="currentFloorLabel" style="font-weight: bold; font-size: 16px;">Floor 1 / 3</span>
                    <button onclick="nextFloor()">Next Floor ▶</button>
                </div>
                <div class="zoom-controls">
                    <button onclick="window.zoomMaze(1)">➕ Zoom In</button>
                    <button onclick="window.zoomMaze(0)">Reset</button>
                    <button onclick="window.zoomMaze(-1)">➖ Zoom Out</button>
                </div>
            </div>
            
            <!-- พื้นที่รองรับการ Zoom -->
            <div id="mazeViewArea" class="maze-view-area">
                <div id="mazeContainer" class="maze-container-zoomable"></div>
            </div>

            <!-- ลายน้ำ (Watermark) -->
            <div class="watermark">
                <p style="margin: 0 0 5px 0; font-size: 24px;">Created by <strong>JuiMuiFun</strong></p>
                <a href="https://modrinth.com/plugin/dungeons-tower" target="_blank" style="font-size: 18px; color: #4CAF50; font-weight: bold; text-decoration: none; pointer-events: auto; cursor: pointer;">Dungeons Tower Plugin</a>
            </div>
        </div>
    </div>

    <!-- Room Inspector Modal -->
    <div id="inspectorModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="inspectorTitle">Room Inspector</h3>
                <button onclick="window.closeInspector()" class="btn-danger">X</button>
            </div>
            <div class="modal-body">
                <p><strong>Coordinates:</strong> <span id="inspectorCoords"></span></p>
                <p><strong>Type:</strong> <span id="inspectorType"></span></p>
                <hr style="border: 1px solid #444;">
                <h4>Markers (Spawners, Doors, etc.)</h4>
                <div id="markersContainer"></div>
                <button onclick="window.addMarkerUI()" class="btn-primary" style="font-size:12px; margin-top:10px;">+ Add Marker</button>
            </div>
            <div class="modal-footer">
                <button onclick="window.saveInspector()" class="btn-primary">Save Changes</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
